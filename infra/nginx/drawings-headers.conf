# Security headers for /drawings. A location-level add_header cancels inheritance from the
# server block, so every header is declared again here. PDF.js needs WebAssembly decoders
# ('wasm-unsafe-eval'), a module worker and blob:/data: images and fonts. The worker takes
# its CSP from the worker script response, so this file is also included on /drawings/_next/.
# Keep the literal "connect-src 'self'": scripts/dev.ts rewrites it for HMR.
add_header X-Content-Type-Options nosniff always;
add_header X-Frame-Options DENY always;
add_header Referrer-Policy same-origin always;
add_header Strict-Transport-Security "max-age=15552000" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; worker-src 'self' blob:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
